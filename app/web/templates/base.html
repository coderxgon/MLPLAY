<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLPlay Admin — {% block title %}Panel{% endblock %}</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <div><b>MLPLAY</b><span>Control Center</span></div>
    </div>
    <nav>
      <a href="/admin" class="{{ 'on' if active=='dashboard' }}">📊 Dashboard</a>
      <a href="/admin/users" class="{{ 'on' if active=='users' }}">👥 Users</a>
      <a href="/admin/deposits" class="{{ 'on' if active=='deposits' }}">💰 Deposits</a>
      <a href="/admin/withdrawals" class="{{ 'on' if active=='withdrawals' }}">💸 Withdrawals</a>
      <a href="/admin/payments" class="{{ 'on' if active=='payments' }}">💳 Payment Methods</a>
      <a href="/admin/promotions" class="{{ 'on' if active=='promotions' }}">🎁 Promotions & Codes</a>
      <a href="/admin/games" class="{{ 'on' if active=='games' }}">🎮 Games & Winrate</a>
      <a href="/admin/rankings" class="{{ 'on' if active=='rankings' }}">🏆 Rankings</a>
      <a href="/admin/broadcast" class="{{ 'on' if active=='broadcast' }}">📣 Broadcast</a>
      <a href="/admin/heroes" class="{{ 'on' if active=='heroes' }}">🦸 Heroes</a>
      <a href="/admin/customize" class="{{ 'on' if active=='customize' }}">⚙️ Customize</a>
      <a href="/admin/logs" class="{{ 'on' if active=='logs' }}">🧾 Action Logs</a>
      <a href="/admin/logout">🚪 Logout</a>
    </nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1>{% block h1 %}MLPlay Admin{% endblock %}</h1>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden">
  <div class="modal-box" id="modal-box"></div>
</div>
<script src="/static/admin.js"></script>
</body>
</html>
