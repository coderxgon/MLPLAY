<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MLPlay</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
<header class="hdr">
  <div class="hdr-logo">⚡</div>
  <div class="hdr-title">MLPLAY <b>ARENA</b></div>
  <button class="hdr-home" id="btn-home">🏠</button>
</header>
<main id="app">
  <div class="center muted">Loading arena… ⚡</div>
</main>
<nav class="tabbar" id="tabbar">
  <button data-view="home">🏠<span>Home</span></button>
  <button data-view="deposit">💰<span>Deposit</span></button>
  <button data-view="withdraw">💸<span>Withdraw</span></button>
  <button data-view="history">🧾<span>History</span></button>
  <button data-view="promotions">🎁<span>Promos</span></button>
</nav>
<script src="mini.js"></script>
</body>
</html>
